[tool.poetry]
name = "VidFlow"
version = "0.2.3"
description = "making videos at lightspeed"
authors = ["Andy Sit <andysit173@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "VidFlow", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Only what the package actually imports, with lower bounds instead of pins.
click = ">=8.1"
questionary = ">=2.0"
icecream = ">=2.1"
ffmpeg-python = ">=0.2.0"
opencv-python = ">=4.8"
numpy = ">=1.26"
platformdirs = ">=3.0"
rich = ">=13.0"
av = ">=12.0"
# Test tooling, exposed as the `dev` / `test` extras so `pip install -e .[dev]` works.
pytest = { version = ">=7.4", optional = true }

[tool.poetry.extras]
dev = ["pytest"]
test = ["pytest"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[tool.poetry.scripts]
VidFlow = "VidFlow.cli:run"
vidflow-live = "VidFlow.realtime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: paced in real time or otherwise long-running (deselect with -m 'not slow')",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
